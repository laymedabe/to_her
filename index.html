<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements" id="hearts-container"></div>
    
    <main class="container">
        <!-- Step 0: Sender Selection -->
        <div class="glass-card" id="step-0">
            <h1>Who is sending this? 💌</h1>
            <p>Just setting up the vibe...</p>
            <div class="button-group" style="flex-direction: column; gap: 15px;">
                <button class="btn btn-primary" onclick="startFlow('himToHer')">I'm a Guy (Him to Her)</button>
                <button class="btn btn-primary" onclick="startFlow('herToHim')">I'm a Girl (Her to Him)</button>
            </div>
        </div>

        <div class="glass-card hidden" id="step-1">
            <img src="meme1.png" alt="Meme" class="cat-icon">
            <h1 id="s1-title"></h1>
            <p id="s1-text"></p>
            <button class="btn btn-primary" onclick="nextStep()">Ugh, fine. What ba?</button>
        </div>

        <div class="glass-card hidden" id="step-2">
            <img src="meme2.png" alt="Meme" class="cat-icon heartbeat">
            <h1 id="s2-title"></h1>
            <p id="s2-text"></p>
            <div class="button-group">
                <button class="btn btn-yes" id="yes-btn" onclick="sayYes()">Super G! 🙄</button>
                <button class="btn btn-no" id="no-btn">Ew, I have bad taste</button>
            </div>
        </div>

        <div class="glass-card hidden" id="step-3">
            <div class="meme-stack">
                <img src="meme3.gif" alt="Meme" class="meme-img">
                <img src="meme4.png" alt="Meme" class="meme-img">
                <p class="meme-text">yieee, chat mo na ako usap na us</p>
                
                <audio controls loop autoplay class="meme-audio" id="bg-audio">
                    <source src="music.mp3" type="audio/mpeg">
                </audio>
                
                <p class="meme-text">i love you my honeybunch sugar pumpy-umpy-umpkin mwamwa</p>
                <img src="meme5.png" alt="Meme" class="meme-img">
                <img src="meme7.png" alt="Meme" class="meme-img">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
